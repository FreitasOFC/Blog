<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Do Dia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #ff0000;
            color: #fffdfd;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 10px;
            text-align: center;
        }

        /* Galeria em grade flexível */
        .galeria {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        /* Imagens no tamanho original, sem borda arredondada */
        .galeria img {
            border-radius: 0;      /* Sem bordas arredondadas */
            max-width: 100%;       /* Evita que a imagem transborde da tela */
            height: auto;          /* Mantém o tamanho e proporção originais */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Notícias Do Dia</h1>
    </header>

    <div class="container">
        <h2>Notícias Mais Bizarras</h2>
        <p>Só coisa medonha</p>

        <div class="galeria">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTNPwXcp8K09ejbqniB66Of6KuPLiPS0AGADwHHtUTzA&s=10" alt="Imagem bizarra 1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmUvo1zP2i0J9ZpqXHTtPM9fL8mEjsiCvu48Jxu06X6HUeUYC1wRdpH3A&s=10" alt="Imagem bizarra 2">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkruvFX45dpF4h1TEpUushoFm0v7X6lFGFM4SF-VgQm1dbRAvDaWn5G08&s=10" alt="Imagem bizarra 3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6Gg3bVLqBh7Zt31NB3MQEEFl_AvrpmOpveVhJpBUShc9T9wLkR6NOqgop&s=10" alt="Imagem bizarra 4">
            <img src="https://preview.redd.it/39zr9h102p1e1.jpeg?auto=webp&s=5981ff02c844f5b6c94391210f3e644575bf5086" alt="Imagem bizarra 5">
        </div>
    </div>

</body>
</html>
