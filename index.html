<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Do Dia</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #4a0000; color: #fff; text-align: center; }
        header { background: #f00; padding: 10px 0; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .card img { border: 3px solid #fff; max-width: 100%; height: auto; }
        .btn-like { display: block; margin: 8px auto 0; background: #f00; color: #fff; border: 2px solid #fff; padding: 6px 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header><h1>Notícias Do Dia</h1></header>

    <h2>Notícias Mais Bizarras</h2>
    <p>Só coisa medonha</p>

    <div class="galeria">
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSTNPwXcp8K09ejbqniB66Of6KuPLiPS0AGADwHHtUTzA&s=10" alt="">
            <button class="btn-like" onclick="curtir(this)">❤️ Like (<span>0</span>)</button>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmUvo1zP2i0J9ZpqXHTtPM9fL8mEjsiCvu48Jxu06X6HUeUYC1wRdpH3A&s=10" alt="">
            <button class="btn-like" onclick="curtir(this)">❤️ Like (<span>0</span>)</button>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkruvFX45dpF4h1TEpUushoFm0v7X6lFGFM4SF-VgQm1dbRAvDaWn5G08&s=10" alt="">
            <button class="btn-like" onclick="curtir(this)">❤️ Like (<span>0</span>)</button>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6Gg3bVLqBh7Zt31NB3MQEEFl_AvrpmOpveVhJpBUShc9T9wLkR6NOqgop&s=10" alt="">
            <button class="btn-like" onclick="curtir(this)">❤️ Like (<span>0</span>)</button>
        </div>
        <div class="card">
            <img src="https://preview.redd.it/39zr9h102p1e1.jpeg?auto=webp&s=5981ff02c844f5b6c94391210f3e644575bf5086" alt="">
            <button class="btn-like" onclick="curtir(this)">❤️ Like (<span>0</span>)</button>
        </div>
    </div>

    <script>
        function curtir(btn) {
            const span = btn.querySelector('span');
            span.innerText = +span.innerText + 1;
        }
    </script>
</body>
</html>
